<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sistema DUBEM - Pedidos</title>
    <style>
        :root { --primary: #2c3e50; --accent: #27ae60; --whatsapp: #25d366; --destaque: #ff8c00; --light: #ecf0f1; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #f0f2f5; margin: 0; padding: 15px; color: #333; font-size: 13px; }
        .container { max-width: 1000px; background: white; padding: 25px; border-radius: 15px; box-shadow: 0 8px 30px rgba(0,0,0,0.1); margin: auto; }
        .header-logo img { max-height: 70px; margin-bottom: 10px; }
        h2 { color: var(--primary); border-bottom: 2px solid var(--light); padding-bottom: 10px; margin-top: 0; }
        
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 15px; }
        .field { display: flex; flex-direction: column; }
        label { font-weight: bold; font-size: 10px; margin-bottom: 4px; color: #555; text-transform: uppercase; }
        
        input, select, textarea { 
            padding: 8px; 
            border: 1px solid #000000; 
            border-radius: 5px; 
            outline: none; 
            font-size: 13px; 
            background: #fff; 
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        input:focus, select:focus, textarea:focus {
            border-color: var(--destaque);
            box-shadow: 0 0 0 1px var(--destaque), 0 0 10px rgba(255, 140, 0, 0.55);
        }

        .alerta {
            border-color: #e74c3c !important;
            box-shadow: 0 0 0 1px #e74c3c, 0 0 10px rgba(231, 76, 60, 0.5) !important;
            background: #fff5f5 !important;
        }

        .quadros-wrapper { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 15px; margin: 15px 0; }
        .quadro { border: 1px solid #000; border-top: 4px solid var(--destaque); padding: 12px; border-radius: 8px; background: #fafafa; }
        .quadro h4 { margin: 0 0 10px 0; text-align: center; color: var(--primary); }
        .medida-linha { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
        .medida-linha input { width: 50px; text-align: center; padding: 4px; border: 1px solid #000; }

        .pagamentos-box { background: #fdfdfd; padding: 12px; border-radius: 8px; border: 1px solid #000; margin-bottom: 15px; }
        .pagamentos-box h4 { margin: 0 0 10px 0; font-size: 11px; text-transform: uppercase; color: #555; }
        .pagto-linha { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
        .pagto-linha select { flex: 1.2; }
        .pagto-linha .valor-pagto { flex: 1; }
        .btn-remove-pagto { flex: 0 0 34px; padding: 8px; background: #e74c3c; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; visibility: hidden; }

        .total-box { 
            background: var(--primary); 
            color: white; 
            padding: 12px; 
            border-radius: 8px; 
            text-align: left; 
            font-weight: bold; 
            font-size: 16px; 
            margin-bottom: 15px; 
            border-left: 6px solid var(--destaque); 
        }
        
        .signature-box { border: 2px dashed #000; background: #ffffff !important; border-radius: 10px; touch-action: none; margin-top: 5px; position: relative; }
        #canvas-assinatura { width: 100%; height: 160px; display: block; cursor: crosshair; }
        #assinatura-imagem { display: none; width: 100%; height: 160px; object-fit: contain; }

        .buttons { display: flex; gap: 8px; margin-top: 15px; }
        button { flex: 1; padding: 12px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; text-transform: uppercase; color: white; font-size: 11px; }
        .btn-save { background: var(--accent); }
        .btn-wa { background: var(--whatsapp); }
        .btn-print { background: #34495e; }

        @media print { 
            .no-print { display: none !important; } 
            .container { box-shadow: none; width: 100%; padding: 0; border-radius: 0; }
            #canvas-assinatura { display: none !important; }
            #assinatura-imagem { display: block !important; }
            .signature-box { border: 1px solid #000; }
        }
    </style>
</head>
<body>

<form id="formPedido">
<div class="container">
    <div class="header-logo"><img src="https://iili.io/qdBJFiF.jpg" alt="Logo"></div>
    <h2>Pedido Nº: <span id="display-numero">...</span></h2>

    <div class="grid">
        <div class="field"><label>Data Pedido</label><input type="text" id="data" readonly></div>
		<div class="field"><label>Atendente</label><select id="atendente"><option value="">Selecione...</option><option>Fernanda</option><option>Mayara</option><option>Cláudia</option><option>John</option><option>Pedro</option><option>Yago</option></select></div>
        <div class="field"><label>Cliente</label><input type="text" id="cliente" placeholder="Nome completo do cliente" list="lista-clientes"></div>
        <div class="field"><label>Contato (WhatsApp)</label><input type="text" id="contato" placeholder="5511999999999"></div>
        <div class="field"><label>Endereço</label><input type="text" id="endereco" placeholder="Rua, número, bairro, cidade"></div>
    </div>
    <datalist id="lista-clientes"></datalist>

    <div class="grid">
        <div class="field"><label>Produto</label><input type="text" id="produto" placeholder="Descrição detalhada do produto"></div>
        <div class="field"><label>Data Produção (+5d úteis)</label><input type="text" id="dataProducao" readonly></div>
        <div class="field"><label>Prev. Entrega (+15d úteis)</label><input type="text" id="prevEntrega"></div>
    </div>

    <div class="grid">
        <div class="field"><label>Sublimação</label><select id="sublimacao"><option value="">Selecione...</option><option>A3</option><option>Bordado</option><option>Total</option><option>Parcial</option><option>Sem Estampa</option><option>DTF</option></select></div>
        <div class="field"><label>Gola</label><select id="gola"><option value="">Selecione...</option><option>V</option><option>Redonda</option><option>Capuz</option><option>Polo</option><option>Itapagé</option><option>Farda</option><option>Casaco</option><option>Alta</option></select></div>
        <div class="field"><label>Tecido</label><select id="tecido"><option value="">Selecione...</option><option>Algodão</option><option>Dry Falcom</option><option>Dry Elastano</option><option>Dry Furado</option><option>Dry Sport</option><option>PP Aquarela</option><option>PP Cor</option><option>PP Elastano</option><option>Piquê</option><option>Helanca</option><option>Helanquinha Lite</option><option>Helanca Colegial</option><option>Moletom</option><option>Tactel</option></select></div>
        <div class="field"><label>Corte</label><select id="corte"><option value="">Selecione...</option><option>Normal</option><option>Regata</option><option>Machão</option><option>Itapajé</option><option>Longa</option><option>Super Cavada</option></select></div>
        <div class="field"><label>Designer</label><select id="designer"><option value="">Selecione...</option><option>Pedro</option><option>Yago</option><option>Loja</option></select></div>	
    </div>

    <div class="grid no-print" style="background: #fdfdfd; padding: 12px; border-radius: 8px; border: 1px solid #000;">
        <div class="field"><label>Valor Total</label><input type="text" id="valor" oninput="mascaraMoeda(this); calcFin()"></div>
        <div class="field"><label>Valor Recebido</label><input type="text" id="recebido" readonly style="background:#f0f0f0"></div>
        <div class="field"><label>À Receber</label><input type="text" id="aReceber" readonly style="background:#f0f0f0"></div>
    </div>

    <div class="pagamentos-box no-print">
        <h4>Formas de Pagamento</h4>
        <div id="pagamentos"></div>
    </div>

    <div class="quadros-wrapper">
        <div class="quadro" data-categoria="Básicas">
            <h4>Básicas</h4>
           <div class="medida-linha">PP <input type="number" class="qtd" data-tam="PP"></div>
            <div class="medida-linha">P <input type="number" class="qtd" data-tam="P"></div>
            <div class="medida-linha">M <input type="number" class="qtd" data-tam="M"></div>
            <div class="medida-linha">G <input type="number" class="qtd" data-tam="G"></div>
            <div class="medida-linha">GG <input type="number" class="qtd" data-tam="GG"></div>
            <div class="medida-linha">EGG <input type="number" class="qtd" data-tam="EGG"></div>
        </div>
        <div class="quadro" data-categoria="Baby Look">
            <h4>Baby Look</h4>
            <div class="medida-linha">PP <input type="number" class="qtd" data-tam="PP"></div>
            <div class="medida-linha">P <input type="number" class="qtd" data-tam="P"></div>
            <div class="medida-linha">M <input type="number" class="qtd" data-tam="M"></div>
            <div class="medida-linha">G <input type="number" class="qtd" data-tam="G"></div>
            <div class="medida-linha">GG <input type="number" class="qtd" data-tam="GG"></div>
            <div class="medida-linha">EGG <input type="number" class="qtd" data-tam="EGG"></div>
        </div>
        <div class="quadro" data-categoria="Infantil">
            <h4>Infantil</h4>
            <div class="medida-linha">01 <input type="number" class="qtd" data-tam="01"></div>
            <div class="medida-linha">02 <input type="number" class="qtd" data-tam="02"></div>
            <div class="medida-linha">04 <input type="number" class="qtd" data-tam="04"></div>
            <div class="medida-linha">06 <input type="number" class="qtd" data-tam="06"></div>
            <div class="medida-linha">08 <input type="number" class="qtd" data-tam="08"></div>
            <div class="medida-linha">10 <input type="number" class="qtd" data-tam="10"></div>
            <div class="medida-linha">12 <input type="number" class="qtd" data-tam="12"></div>
        </div>
    </div>

    <div class="total-box">Quantidade Total: <span id="total-geral">0</span></div>

    <div class="grid">
        <div class="field"><label>Status</label><select id="status"><option>No Prazo</option></select></div>
        <div class="field"><label>Evento</label><select id="costura"><option value="">Selecione...</option><option>Evento</option></select></div>
        <div class="field"><label>Seção</label><select id="secao"><option>Estamparia</option></select></div>
        <div class="field"><label>Costura Gola</label><select id="corteGolaPrint"><option value="">Selecione...</option><option>Ribana</option><option>Polo</option><option>Viés 3cm</option><option>Viés 5cm</option><option>Itapajé 2</option><option>Itapajé 3</option><option>Outras</option><option>Alta</option></select></div>
        <div class="field"><label>Costura Manga</label><select id="corteMangaPrint"><option value="">Selecione...</option><option>Normal</option><option>Punho</option><option>S. Punho</option><option>Ribana</option><option>Viés</option></select></div>
    </div>

    <div class="field"><label>Observação</label><textarea id="observacao" rows="2"></textarea></div>

    <div style="margin-top:15px;">
        <label style="color:var(--destaque); font-size:11px">Assinatura do Cliente</label>
        <div class="signature-box">
            <canvas id="canvas-assinatura"></canvas>
            <img id="assinatura-imagem" alt="Assinatura">
        </div>
        <button type="button" class="no-print" onclick="limparAssinatura()" style="background:#e74c3c; color:white; padding:5px; margin-top:5px; border:none; border-radius:4px; cursor:pointer;">Limpar Assinatura</button>
    </div>

    <div class="buttons no-print">
        <button type="button" class="btn-save" onclick="salvarDados()" id="btn-save">💾 Salvar Pedido</button>
        <button type="button" id="btn-wa-salvo" class="btn-wa" style="display:none;" onclick="abrirModalWhatsApp()">💬 WhatsApp Nº <span id="lbl-wa-num"></span></button>
        <button type="button" class="btn-print" onclick="gerarPDF()">🖨️ PDF</button>
    </div>
</div>
</form>

<div id="modal-wa" class="no-print" style="display:none; position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.55); z-index:99999; align-items:center; justify-content:center;">
    <div style="background:#fff; border-radius:12px; padding:18px; width:92%; max-width:620px; max-height:85vh; overflow:auto; box-shadow:0 10px 40px rgba(0,0,0,0.3);">
        <h3 style="margin-top:0; color:var(--primary); border-bottom:2px solid var(--light); padding-bottom:10px;">Pedido Nº <span id="modal-num"></span></h3>
        <textarea id="modal-msg" rows="16" readonly style="width:100%; box-sizing:border-box; font-family:Consolas, monospace; font-size:12px; resize:vertical;"></textarea>
        <div class="buttons no-print" style="margin-top:12px;">
            <button type="button" class="btn-wa" onclick="enviarWhatsAppSalvo()">📱 Enviar via WhatsApp Web</button>
            <button type="button" class="btn-save" onclick="copiarMensagem()" style="background:#34495e;">📋 Copiar mensagem</button>
            <button type="button" class="btn-print" onclick="fecharModalWhatsApp()" style="background:#95a5a6;">Fechar</button>
        </div>
    </div>
</div>

<script>
    const scriptURL = 'https://script.google.com/macros/s/AKfycbzTXF739D8RtnrYHin8ybAshJHv_XRvuvOx95YUBQp0b_iZzZXfEr3SEDfwOBmRC6qehg/exec'; 

    const canvas = document.getElementById('canvas-assinatura');
    const ctx = canvas.getContext('2d');
    let desenhando = false;
    let jaAssinou = false; 

    function ajustarCanvas() {
        if (jaAssinou) return; 
        const r = canvas.getBoundingClientRect();
        canvas.width = r.width;
        canvas.height = r.height;
        ctx.strokeStyle = "#000";
        ctx.lineWidth = 2.5;
        ctx.lineCap = "round";
    }

    function getPos(e) {
        const r = canvas.getBoundingClientRect();
        const cx = e.touches ? e.touches[0].clientX : e.clientX;
        const cy = e.touches ? e.touches[0].clientY : e.clientY;
        return { x: cx - r.left, y: cy - r.top };
    }

    function start(e) { 
        desenhando = true; 
        jaAssinou = true; 
        const p = getPos(e); ctx.beginPath(); ctx.moveTo(p.x, p.y); 
        if(e.touches) e.preventDefault(); 
    }
    function move(e) { 
        if(!desenhando) return; 
        const p = getPos(e); ctx.lineTo(p.x, p.y); ctx.stroke(); 
        if(e.touches) e.preventDefault(); 
    }
    function stop() { desenhando = false; }

    canvas.addEventListener('mousedown', start);
    canvas.addEventListener('mousemove', move);
    window.addEventListener('mouseup', stop);
    canvas.addEventListener('touchstart', start, {passive: false});
    canvas.addEventListener('touchmove', move, {passive: false});
    canvas.addEventListener('touchend', stop);

    function limparAssinatura() { 
        ctx.clearRect(0,0,canvas.width,canvas.height); 
        jaAssinou = false; 
        document.getElementById('assinatura-imagem').src = "";
    }

    function mascaraMoeda(i) {
        let v = i.value.replace(/\D/g, "");
        v = (v / 100).toFixed(2) + "";
        v = v.replace(".", ",");
        v = v.replace(/(\d)(\d{3}),/g, "$1.$2,");
        i.value = "R$ " + v;
    }
    function parseMoeda(s) {
        return parseFloat((s || "").replace("R$ ","").replace(/\./g,"").replace(",",".")) || 0;
    }
    function linhaDados(l) {
        return { forma: l.querySelector('.forma-pagto').value, valor: l.querySelector('.valor-pagto').value, num: parseMoeda(l.querySelector('.valor-pagto').value) };
    }
    function getPagamentos() {
        return Array.from(document.querySelectorAll('.pagto-linha')).map(linhaDados);
    }
    function criarLinhaPagamento(formaValor, valorValor) {
        const div = document.createElement('div');
        div.className = 'pagto-linha';
        const select = document.createElement('select');
        select.className = 'forma-pagto';
        select.innerHTML = '<option value="">Selecione...</option><option>Pix</option><option>Dinheiro</option><option>Cartão</option>';
        select.value = formaValor || "";
        select.dataset.prev = formaValor || "";
        const input = document.createElement('input');
        input.type = 'text';
        input.className = 'valor-pagto';
        input.placeholder = 'R$ 0,00';
        input.value = valorValor || "";
        input.oninput = () => { mascaraMoeda(input); calcFin(); };
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'btn-remove-pagto';
        btn.textContent = '✕';
        btn.title = 'Remover pagamento';
        btn.onclick = () => { div.remove(); calcFin(); };
        div.appendChild(select);
        div.appendChild(input);
        div.appendChild(btn);
        return div;
    }
    function atualizarLinhasPagamento() {
        const container = document.getElementById('pagamentos');
        const total = parseMoeda(document.getElementById('valor').value);
        let linhas = container.querySelectorAll('.pagto-linha');

        for (let i = linhas.length - 1; i >= 1; i--) {
            const p = linhaDados(linhas[i]);
            if (!p.forma && p.num === 0) linhas[i].remove();
            else break;
        }

        linhas = container.querySelectorAll('.pagto-linha');
        const pagos = Array.from(linhas).map(linhaDados);
        const recebido = pagos.reduce((s, p) => s + p.num, 0);
        const ultimaVazia = linhas.length > 0 && !pagos[pagos.length - 1].forma && pagos[pagos.length - 1].num === 0;

        if (linhas.length === 0 || (total > 0 && recebido < total && !ultimaVazia)) {
            container.appendChild(criarLinhaPagamento("", ""));
        }

        linhas = container.querySelectorAll('.pagto-linha');
        linhas.forEach(l => {
            l.querySelector('.btn-remove-pagto').style.visibility = linhas.length > 1 ? 'visible' : 'hidden';
        });
    }
    function calcFin() {
        const total = parseMoeda(document.getElementById('valor').value);
        const recebido = getPagamentos().reduce((s, p) => s + p.num, 0);
        const aReceber = total - recebido;
        document.getElementById('recebido').value = "R$ " + recebido.toLocaleString('pt-BR', {minimumFractionDigits: 2});
        document.getElementById('aReceber').value = "R$ " + aReceber.toLocaleString('pt-BR', {minimumFractionDigits: 2});
        const recEl = document.getElementById('recebido');
        if (total > 0 && recebido > total) recEl.classList.add('alerta');
        else recEl.classList.remove('alerta');
        atualizarLinhasPagamento();
    }

    function evitarFormaDuplicada(e) {
        if (!e.target.classList.contains('forma-pagto')) return;
        const sel = e.target;
        const escolhida = sel.value;
        if (!escolhida) { sel.dataset.prev = ""; return; }
        const duplicada = Array.from(document.querySelectorAll('.forma-pagto'))
            .some(s => s !== sel && s.value === escolhida);
        if (duplicada) {
            alert('⚠️ A forma "' + escolhida + '" já está sendo usada em outra linha. Escolha outra.');
            sel.value = sel.dataset.prev || "";
        } else {
            sel.dataset.prev = escolhida;
        }
    }

    document.querySelectorAll('.qtd').forEach(i => i.addEventListener('input', () => {
        let s = 0; document.querySelectorAll('.qtd').forEach(q => s += (parseInt(q.value) || 0));
        document.getElementById('total-geral').innerText = s;
    }));

    function gerarPDF() {
        const imgAssinatura = document.getElementById('assinatura-imagem');
        if (jaAssinou) { try { imgAssinatura.src = canvas.toDataURL("image/png"); } catch(e) { imgAssinatura.src = ""; } }
        else { imgAssinatura.src = ""; }
        const num = document.getElementById('display-numero').innerText;
        const cli = document.getElementById('cliente').value || "Cli";
        const des = document.getElementById('designer').value || "Des";
        const originalTitle = document.title;
        document.title = `Pedido_${num}_${cli}_${des}`;
        window.print();
        setTimeout(() => { document.title = originalTitle; }, 1000);
    }

    function montarMensagemPedido(ped) {
        const pags = (ped.pags || []).filter(p => p.forma && p.num > 0);
        const detPag = pags.length ? pags.map(p => `${p.forma}: ${p.valor}`).join(" | ") : "-";
        return `*Obrigado por ter escolhido a Loja DUBEM!*

Segue dados do seu pedido:
*Nº do Pedido:* ${ped.numero}
*Cliente:* ${ped.cliente}
*Produto:* ${ped.produto}
*Tecido:* ${ped.tecido}
*Data do Pedido:* ${ped.data}
*Prev. de Entrega:* ${ped.prevEntrega}

*Grade de tamanhos:*${ped.grade || ''}

*Quantidade total:* ${ped.qtdTotal}
*Valor Total:* ${ped.valor}
*Valor Recebido:* ${ped.recebido}
*Pagamentos:* ${detPag}
*Valor à Pagar:* ${ped.aReceber}

*Obrigado pela preferência!*

*Atenção:*	 
Caro cliente;
Prazo mínimo de entrega 12 dias úteis. 
Troca, somente peças com defeito em até 24h.
Em caso de reembolso, somente após 10 dias úteis do vencimento do pedido.`;
    }

    function montarGradeTexto(detalhesTamanhos) {
        let grade = "";
        const porCat = {};
        (detalhesTamanhos || []).forEach(i => {
            (porCat[i.categoria] = porCat[i.categoria] || []).push(i);
        });
        Object.keys(porCat).forEach(cat => {
            grade += `\n*${cat}*`;
            porCat[cat].forEach(i => { grade += `\n   - ${i.tamanho}: ${i.quantidade}`; });
        });
        return grade;
    }

    function salvarUltimoPedido(ped) {
        ultimoPedido = ped;
        try { sessionStorage.setItem('ultimoPedido', JSON.stringify(ped)); } catch(e) {}
        const btn = document.getElementById('btn-wa-salvo');
        const lbl = document.getElementById('lbl-wa-num');
        if (btn) btn.style.display = 'block';
        if (lbl) lbl.innerText = ped.numero;
    }

    function armarOcultarAposEdicao() {
        const form = document.getElementById('formPedido');
        const ocultar = () => {
            const btn = document.getElementById('btn-wa-salvo');
            if (btn) btn.style.display = 'none';
            ultimoPedido = null;
            try { sessionStorage.removeItem('ultimoPedido'); } catch(e) {}
            form.removeEventListener('input', ocultar, true);
            form.removeEventListener('change', ocultar, true);
        };
        form.addEventListener('input', ocultar, true);
        form.addEventListener('change', ocultar, true);
    }

    function restaurarUltimoPedido() {
        try {
            const salvo = sessionStorage.getItem('ultimoPedido');
            if (!salvo) return;
            const p = JSON.parse(salvo);
            if (!p || !p.numero) return;
            ultimoPedido = p;
            const btn = document.getElementById('btn-wa-salvo');
            const lbl = document.getElementById('lbl-wa-num');
            if (btn) { btn.style.display = 'block'; if (lbl) lbl.innerText = p.numero; }
        } catch(e) {}
    }

    function abrirModalWhatsApp() {
        if (!ultimoPedido) return;
        document.getElementById('modal-num').innerText = ultimoPedido.numero;
        document.getElementById('modal-msg').value = montarMensagemPedido(ultimoPedido);
        document.getElementById('modal-wa').style.display = 'flex';
    }

    function fecharModalWhatsApp() {
        document.getElementById('modal-wa').style.display = 'none';
    }

    function abrirWhatsApp(numeroWhats, msg) {
        const base = `https://web.whatsapp.com/send?phone=${numeroWhats}&text=${encodeURIComponent(msg)}`;
        const nova = window.open(base, '_blank');
        if (!nova) window.location.href = base;
    }

    function enviarWhatsAppSalvo() {
        if (!ultimoPedido) return;
        const fone = String(ultimoPedido.contato || '').replace(/\D/g, "");
        if (!fone) { alert("Pedido sem contato cadastrado."); return; }
        const msg = montarMensagemPedido(ultimoPedido);
        abrirWhatsApp(fone, msg);
    }

    function copiarMensagem() {
        if (!ultimoPedido) return;
        const texto = montarMensagemPedido(ultimoPedido);
        const ta = document.getElementById('modal-msg');
        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(texto).then(() => alert('✅ Mensagem copiada! Cole no WhatsApp.'), () => copiarFallback(ta));
        } else {
            copiarFallback(ta);
        }
    }

    function copiarFallback(ta) {
        ta.removeAttribute('readonly');
        ta.select();
        ta.setSelectionRange(0, ta.value.length);
        document.execCommand('copy');
        ta.setAttribute('readonly', '');
        alert('✅ Mensagem copiada! Cole no WhatsApp.');
    }

    function getClientesSalvos() {
        try { return JSON.parse(localStorage.getItem('clientesSalvos') || '[]'); } catch(e) { return []; }
    }

    function atualizarDatalistClientes() {
        const dl = document.getElementById('lista-clientes');
        dl.innerHTML = '';
        getClientesSalvos().forEach(c => {
            const op = document.createElement('option');
            op.value = c;
            dl.appendChild(op);
        });
    }

    function salvarClienteLocal(nome) {
        if (!nome) return;
        const lista = getClientesSalvos();
        if (lista.some(c => c.toLowerCase() === nome.toLowerCase())) return;
        lista.push(nome);
        lista.sort((a, b) => a.localeCompare(b, 'pt-BR'));
        localStorage.setItem('clientesSalvos', JSON.stringify(lista));
        atualizarDatalistClientes();
    }

    let tokenPedidoAtual = null;
    let numeroReservado = null;
    let ultimoPedido = null;

    function gerarToken() {
        if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
        return 't' + Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
    }

    async function enviarComRetry(dados, tentativas) {
        let ultimoErro = null;
        for (let i = 0; i < tentativas; i++) {
            try {
                const r = await fetch(scriptURL + '?t=' + Date.now() + i, {
                    method: 'POST',
                    redirect: 'follow',
                    cache: 'no-store',
                    body: JSON.stringify(dados)
                });
                const texto = await r.text();
                if (!r.ok) throw new Error('Servidor retornou erro: ' + r.status);
                if (texto && texto.startsWith('Erro')) throw new Error(texto);
                return texto;
            } catch (e) {
                ultimoErro = e;
                if (i < tentativas - 1) await new Promise(res => setTimeout(res, 2000 * (i + 1)));
            }
        }
        throw ultimoErro;
    }

    async function verificarStatus(token) {
        try {
            const r = await fetch(scriptURL + '?acao=status&token=' + encodeURIComponent(token) + '&_=' + Date.now(), { cache: 'no-store', redirect: 'follow' });
            const t = (await r.text() || '').trim();
            if (t && t.startsWith('Sucesso:')) return t.split(':')[1].trim();
        } catch (e) {}
        return null;
    }

    async function salvarDados() {
        // Validação dos campos obrigatórios
        const cliente = document.getElementById('cliente').value.trim();
        const produto = document.getElementById('produto').value.trim();
        const atendente = document.getElementById('atendente').value;
        if (!cliente || !produto || !atendente) {
            alert('⚠️ Preencha ao menos Cliente, Produto e Atendente antes de salvar.');
            return;
        }

        const totalPedido = parseMoeda(document.getElementById('valor').value);
        const pagamentos = getPagamentos().filter(p => p.forma && p.num > 0);
        const somaPagamentos = pagamentos.reduce((s, p) => s + p.num, 0);
        if (totalPedido > 0 && somaPagamentos > totalPedido) {
            alert('⚠️ A soma das formas de pagamento (' + document.getElementById('recebido').value + ') é maior que o Valor Total (' + document.getElementById('valor').value + '). Confira os valores.');
            return;
        }
        const principal = pagamentos[0] || { valor: "", forma: "" };
        const extras = pagamentos.slice(1);

        if (!tokenPedidoAtual) tokenPedidoAtual = gerarToken();

        const btn = document.getElementById('btn-save'); 
        btn.disabled = true; btn.innerText = "Salvando...";
        
        let gradeArr = [];
        document.querySelectorAll('.qtd').forEach(i => {
            if(i.value > 0) gradeArr.push({ categoria: i.closest('.quadro').dataset.categoria, tamanho: i.dataset.tam, quantidade: i.value });
        });

        const dados = {
            numero: null, // Número gerado pelo servidor com lock (evita duplicidade)
            token: tokenPedidoAtual,
            data: document.getElementById('data').value,
            cliente: document.getElementById('cliente').value,
            contato: document.getElementById('contato').value, // INFO ENVIADA PARA O DRIVE
            endereco: document.getElementById('endereco').value,
            dataProducao: document.getElementById('dataProducao').value,
            prevEntrega: document.getElementById('prevEntrega').value,
            produto: document.getElementById('produto').value,
            sublimacao: document.getElementById('sublimacao').value,
            gola: document.getElementById('gola').value,
            tecido: document.getElementById('tecido').value,
            corte: document.getElementById('corte').value,
            designer: document.getElementById('designer').value,
            valor: document.getElementById('valor').value,
            recebido: principal.valor,
            aReceber: document.getElementById('aReceber').value,
            forma: principal.forma,
            status: document.getElementById('status').value,
            costura: document.getElementById('costura').value,
            secao: document.getElementById('secao').value,
            corteGola: document.getElementById('corteGolaPrint').value,
            corteManga: document.getElementById('corteMangaPrint').value,
            observacao: document.getElementById('observacao').value,
            quantidadeTotal: document.getElementById('total-geral').innerText,
            detalhesTamanhos: gradeArr,
            atendente: document.getElementById('atendente').value,
            assinatura: (function() {
                const c = document.getElementById('canvas-assinatura');
                try { return c && c.width > 0 ? c.toDataURL('image/png') : ''; } catch(e) { return ''; }
            })()
        };

        async function postExtra(pagto, numero, idx) {
            const extra = {
                modoExtra: true,
                numero: numero,
                data: document.getElementById('data').value,
                cliente: document.getElementById('cliente').value,
                forma: pagto.forma,
                recebido: pagto.valor,
                token: numero + '_extra_' + idx + '_' + pagto.forma
            };
            await enviarComRetry(extra, 2);
        }

        try {
            let texto;
            try {
                texto = await enviarComRetry(dados, 2);
            } catch (e) {
                // O POST pode responder 404 mesmo com o pedido salvo no servidor.
                // Confere via GET se a gravação realmente ocorreu antes de dar erro.
                const verificado = await verificarStatus(tokenPedidoAtual);
                if (!verificado) throw e;
                texto = 'Sucesso:' + verificado;
            }
            const numeroGerado = texto.includes(':') ? texto.split(':')[1].trim() : texto;

            tokenPedidoAtual = null;
            salvarClienteLocal(document.getElementById('cliente').value);

            let errosExtras = [];
            for (let idx = 0; idx < extras.length; idx++) {
                try { await postExtra(extras[idx], numeroGerado, idx); }
                catch(e2) { errosExtras.push(extras[idx].forma + ': ' + e2.message); }
            }

            if (errosExtras.length > 0) {
                alert('✅ Pedido Nº ' + numeroGerado + ' salvo com sucesso!\n⚠️ Não foi possível gravar as formas complementares:\n - ' + errosExtras.join('\n - ') + '\nCadastre-as manualmente se necessário.');
            } else {
                alert('✅ Pedido Nº ' + numeroGerado + ' salvo com sucesso!');
            }
            salvarUltimoPedido({
                numero: numeroGerado,
                contato: document.getElementById('contato').value,
                cliente: document.getElementById('cliente').value,
                produto: document.getElementById('produto').value,
                tecido: document.getElementById('tecido').value,
                data: document.getElementById('data').value,
                prevEntrega: document.getElementById('prevEntrega').value,
                qtdTotal: document.getElementById('total-geral').innerText,
                valor: document.getElementById('valor').value,
                recebido: document.getElementById('recebido').value,
                aReceber: document.getElementById('aReceber').value,
                pags: pagamentos,
                grade: montarGradeTexto(gradeArr)
            });
            btn.disabled = false;
            btn.innerText = "💾 Salvar Pedido";
            armarOcultarAposEdicao();
            document.getElementById('formPedido').reset();
            limparAssinatura();
            document.getElementById('total-geral').innerText = "0";
            calcFin();
            inicializarDatas();
        } catch(e) { 
            alert('❌ Erro ao salvar: ' + e.message); 
            btn.disabled = false; 
            btn.innerText = "💾 Salvar Pedido"; 
        }
    }

    function adicionarDiasUteis(data, dias) {
        let dataFinal = new Date(data);
        let diasContados = 0;
        while (diasContados < dias) {
            dataFinal.setDate(dataFinal.getDate() + 1);
            let diaSemana = dataFinal.getDay();
            if (diaSemana !== 0 && diaSemana !== 6) {
                diasContados++;
            }
        }
        return dataFinal;
    }

    async function carregarNumeroPedido() {
        const el = document.getElementById('display-numero');
        el.innerText = '...';
        if (!tokenPedidoAtual) tokenPedidoAtual = gerarToken();
        const controle = new AbortController();
        const timer = setTimeout(() => controle.abort(), 30000);
        let numero = null;
        try {
            const r = await fetch(scriptURL + '?_=' + Date.now(), { cache: 'no-store', redirect: 'follow', signal: controle.signal });
            const t = (await r.text() || '').trim();
            const n = Number(t);
            if (!isNaN(n) && n > 0 && t.length <= 10) numero = n;
        } catch (e) {
        } finally {
            clearTimeout(timer);
        }
        el.innerText = numero != null ? String(numero) : '· · ·';
        numeroReservado = numero;
        return numero;
    }

    function inicializarDatas() {
        const hoje = new Date();
        const formatar = (d) => d.toLocaleDateString('pt-BR');
        document.getElementById('data').value = formatar(hoje);
        document.getElementById('dataProducao').value = formatar(adicionarDiasUteis(hoje, 5));
        document.getElementById('prevEntrega').value = formatar(adicionarDiasUteis(hoje, 15));
        carregarNumeroPedido();
    }

    window.onload = () => {
        inicializarDatas();
        ajustarCanvas();
        window.addEventListener('resize', ajustarCanvas);
        document.getElementById('pagamentos').addEventListener('change', evitarFormaDuplicada);
        atualizarDatalistClientes();
        calcFin();
        restaurarUltimoPedido();
    };
</script>
